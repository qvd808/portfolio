name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4 # Updated v3 -> v4

      - name: Setup Node
        uses: actions/setup-node@v4 # Updated v3 -> v4
      
      - name: Install Dependencies
        uses: bahmutov/npm-install@v1

      - name: Build the artifact
        run: npm run build
      
      - name: Upload production-ready build files
        uses: actions/upload-artifact@v4 # Updated v3 -> v4
        with:
          name: production-files
          path: ./dist
  
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4 # Updated v3 -> v4
        with: 
          name: production-files
          path: ./dist
      
      - name: Deploy to Github Pages
        uses: peaceiris/actions-gh-pages@v4 # Updated v3 -> v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
