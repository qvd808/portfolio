<!DOCTYPE html>
<html>
<head>
    <title>ADHD Neural Plasma Network</title>
    <style>
        body { margin: 0; background: #010103; overflow: hidden; font-family: monospace; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const W = () => canvas.width;
const H = () => canvas.height;
const CX = () => W() / 2;
const CY = () => H() / 2;

// --- 3D Network Data ---
const nodesData = [
    { baseX: -420, baseY: -220, baseZ: 40,   r: 78, color: "#3b82f6", name: "Formal Verification" },
    { baseX: 400,  baseY: -260, baseZ: 160,  r: 88, color: "#8b5cf6", name: "RISC-V Core" },
    { baseX: 0,    baseY: 340,  baseZ: -140, r: 72, color: "#10b981", name: "UIL Compiler" },
    { baseX: -460, baseY: 300,  baseZ: 220,  r: 62, color: "#f59e0b", name: "PCB & Embedded" },
    { baseX: 380,  baseY: 280,  baseZ: -200, r: 68, color: "#ef4444", name: "3D Fabrication" }
];

const nodes3D = nodesData.map(n => ({ ...n, x: n.baseX, y: n.baseY, z: n.baseZ, currentR: n.r }));

let activeSphere = 0;
let prevActiveSphere = 0;
let switchFlash = 0;

setInterval(() => {
    let next;
    do { next = Math.floor(Math.random() * nodes3D.length); } while (next === activeSphere);
    prevActiveSphere = activeSphere;
    activeSphere = next;
    switchFlash = 1.0;
}, 5000);

// --- 3D Projection Engine ---
const FOCAL_LENGTH = 600;

function project3D(x, y, z) {
    const scale = FOCAL_LENGTH / Math.max(1, FOCAL_LENGTH + z);
    return { x: CX() + x * scale, y: CY() + y * scale, scale, z };
}

function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return { r, g, b, str: `${r},${g},${b}` };
}

// --- Plasma Globe Lightning System ---
const plasmaBolts = [];
const MAX_BOLTS = 8;

function generateFilamentBranch(radius, startX, startY, startZ, startT, steps) {
    const pts = [];
    const tgtTheta = Math.random() * Math.PI * 2;
    const tgtPhi = Math.acos(2 * Math.random() - 1);
    const tgtX = radius * Math.sin(tgtPhi) * Math.cos(tgtTheta);
    const tgtY = radius * Math.sin(tgtPhi) * Math.sin(tgtTheta);
    const tgtZ = radius * Math.cos(tgtPhi);

    for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const globalT = startT + t * (1 - startT);
        const bx = startX + (tgtX - startX) * t;
        const by = startY + (tgtY - startY) * t;
        const bz = startZ + (tgtZ - startZ) * t;
        const noise = Math.sin(globalT * Math.PI) * radius * 0.35;
        pts.push({
            x: bx + (Math.random() - 0.5) * noise,
            y: by + (Math.random() - 0.5) * noise,
            z: bz + (Math.random() - 0.5) * noise
        });
    }
    return pts;
}

function spawnPlasmaBolt(sphereIdx) {
    const node = nodes3D[sphereIdx];
    const r = node.currentR;
    const mainPts = generateFilamentBranch(r, 0, 0, 0, 0, 12 + Math.floor(Math.random() * 5));
    
    const forks = [];
    const numForks = Math.floor(Math.random() * 2);
    for (let f = 0; f < numForks; f++) {
        const splitIdx = 3 + Math.floor(Math.random() * (mainPts.length - 5));
        const splitPt = mainPts[splitIdx];
        forks.push(generateFilamentBranch(r, splitPt.x, splitPt.y, splitPt.z, splitIdx / 15, 5 + Math.floor(Math.random() * 3)));
    }

    plasmaBolts.push({
        sphere: sphereIdx,
        pts: mainPts,
        forks: forks,
        maxLife: 0.12 + Math.random() * 0.18,
        born: performance.now(),
        flickerOffset: Math.random() * 100
    });
}

function drawPlasmaBolt(bolt, time) {
    if (bolt.sphere !== activeSphere) return;
    const node = nodes3D[bolt.sphere];
    const age = (time - bolt.born) / 1000;
    const life = Math.max(0, 1 - age / bolt.maxLife);
    if (life <= 0) return;

    const flicker = Math.sin(time * 0.015 + bolt.flickerOffset) * 0.15 + 0.85;
    const a = life * flicker;
    const rgb = hexToRgb(node.color);

    function renderPath(pts, isMain) {
        const proj = pts.map(pt => project3D(node.x + pt.x, node.y + pt.y, node.z + pt.z));
        
        // Soft outer glow — thinner, lower alpha
        ctx.beginPath();
        ctx.moveTo(proj[0].x, proj[0].y);
        for (let i = 1; i < proj.length; i++) ctx.lineTo(proj[i].x, proj[i].y);
        ctx.strokeStyle = `rgba(${rgb.str}, ${0.12 * a})`;
        ctx.lineWidth = 8 * proj[0].scale;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = node.color;
        ctx.shadowBlur = 14;
        ctx.stroke();

        // Mid layer — muted
        ctx.beginPath();
        ctx.moveTo(proj[0].x, proj[0].y);
        for (let i = 1; i < proj.length; i++) ctx.lineTo(proj[i].x, proj[i].y);
        ctx.strokeStyle = `rgba(140, 210, 255, ${0.35 * a})`;
        ctx.lineWidth = 2.5 * proj[0].scale;
        ctx.shadowBlur = 4;
        ctx.stroke();

        // Core — fine hairline
        ctx.beginPath();
        ctx.moveTo(proj[0].x, proj[0].y);
        for (let i = 1; i < proj.length; i++) ctx.lineTo(proj[i].x, proj[i].y);
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.7 * a})`;
        ctx.lineWidth = 1 * proj[0].scale;
        ctx.shadowBlur = 0;
        ctx.stroke();

        // Impact blob — smaller, softer
        const endPt = proj[proj.length - 1];
        const tipR = (isMain ? 4 : 2.5) * endPt.scale;
        const g = ctx.createRadialGradient(endPt.x, endPt.y, 0, endPt.x, endPt.y, tipR * 2.5);
        g.addColorStop(0, `rgba(255, 255, 255, ${0.7 * a})`);
        g.addColorStop(0.4, `rgba(${rgb.str}, ${0.45 * a})`);
        g.addColorStop(1, `rgba(${rgb.str}, 0)`);
        ctx.beginPath();
        ctx.arc(endPt.x, endPt.y, tipR * 2.5, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
    }

    renderPath(bolt.pts, true);
    bolt.forks.forEach(fork => renderPath(fork, false));
    ctx.shadowBlur = 0;
}

// --- Render Loop ---
function loop(time) {
    ctx.fillStyle = "rgba(1, 1, 3, 0.4)";
    ctx.fillRect(0, 0, W(), H());

    if (switchFlash > 0) switchFlash *= 0.92;

    // 1. Positional physics
    nodes3D.forEach((n, i) => {
        const isActive = (i === activeSphere);
        const targetX = isActive ? 0 : n.baseX;
        const targetY = isActive ? 0 : n.baseY;
        const targetZ = isActive ? -250 : n.baseZ + 900;
        const targetR = isActive ? n.r : n.r * 0.3;
        
        const speed = isActive ? 0.35 : 0.045;
        n.x += (targetX - n.x) * speed;
        n.y += (targetY - n.y) * speed;
        n.z += (targetZ - n.z) * speed;
        n.currentR += (targetR - n.currentR) * 0.08;
    });

    // 2. Neural Connections
    for (let i = 0; i < nodes3D.length; i++) {
        for (let j = i + 1; j < nodes3D.length; j++) {
            const p1 = project3D(nodes3D[i].x, nodes3D[i].y, nodes3D[i].z);
            const p2 = project3D(nodes3D[j].x, nodes3D[j].y, nodes3D[j].z);
            const midX = (p1.x + p2.x) / 2 + (i - j) * 40 * p1.scale;
            const midY = (p1.y + p2.y) / 2 - 80 * p1.scale;
            const isActiveLink = (i === activeSphere || j === activeSphere);
            
            ctx.lineWidth = isActiveLink ? 1.5 : 1;
            ctx.strokeStyle = isActiveLink ? "rgba(100, 180, 255, 0.1)" : "rgba(40, 40, 60, 0.04)";
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.quadraticCurveTo(midX, midY, p2.x, p2.y);
            ctx.stroke();

            const progress = (time * 0.0005 + i * 0.2 + j * 0.5) % 1;
            const pulseX = Math.pow(1-progress, 2)*p1.x + 2*(1-progress)*progress*midX + Math.pow(progress, 2)*p2.x;
            const pulseY = Math.pow(1-progress, 2)*p1.y + 2*(1-progress)*progress*midY + Math.pow(progress, 2)*p2.y;
            const pulseSize = isActiveLink ? 2 * p1.scale : 0.8 * p1.scale;
            ctx.fillStyle = isActiveLink ? "rgba(100, 240, 255, 0.5)" : "rgba(80, 80, 120, 0.2)";
            ctx.beginPath();
            ctx.arc(pulseX, pulseY, Math.max(0.5, pulseSize), 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // 3. Sort & Draw Nodes
    const sortedNodes = nodes3D.map((n, i) => ({...n, i})).sort((a, b) => b.z - a.z);

    sortedNodes.forEach(node => {
        const isActive = (node.i === activeSphere);
        const p = project3D(node.x, node.y, node.z);
        const radius = Math.max(1, node.currentR * p.scale);

        let drawRadius = radius;
        if (isActive && switchFlash > 0.01) {
            drawRadius = radius * (1 + switchFlash * 0.2);
        }

        if (!isActive) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, drawRadius, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(p.x - drawRadius*0.3, p.y - drawRadius*0.3, drawRadius*0.1, p.x, p.y, drawRadius);
            grad.addColorStop(0, "#1e293b");
            grad.addColorStop(0.5, "#09090b");
            grad.addColorStop(1, "#000000");
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.04)";
            ctx.lineWidth = 1;
            ctx.stroke();
        } else {
            // Glass globe
            ctx.beginPath();
            ctx.arc(p.x, p.y, drawRadius, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(p.x - drawRadius*0.4, p.y - drawRadius*0.4, drawRadius*0.1, p.x, p.y, drawRadius);
            grad.addColorStop(0, "rgba(255, 255, 255, 0.08)");
            grad.addColorStop(0.4, "rgba(5, 5, 15, 0.3)");
            grad.addColorStop(1, "rgba(80, 50, 255, 0.1)");
            ctx.fillStyle = grad;
            ctx.fill();

            const activeBolts = plasmaBolts.filter(b => b.sphere === activeSphere).length;
            const pulse = (activeBolts / MAX_BOLTS) * 0.3 + 0.15 + switchFlash * 0.5;
            ctx.strokeStyle = `rgba(120, 170, 255, ${Math.min(0.7, pulse)})`;
            ctx.lineWidth = 1.5 + switchFlash * 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(p.x, p.y, 8 * p.scale, 0, Math.PI * 2);
            ctx.fillStyle = "#a21caf";
            ctx.shadowColor = "#f472b6";
            ctx.shadowBlur = 12 + switchFlash * 30;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        const labelAlpha = isActive ? 1 : Math.min(1, Math.max(0.25, p.scale * 2));
        ctx.fillStyle = isActive ? "#ffffff" : `rgba(100, 116, 139, ${labelAlpha})`;
        ctx.font = `bold ${Math.max(8, 14 * p.scale)}px monospace`;
        ctx.textAlign = "center";
        ctx.fillText(node.name, p.x, p.y - drawRadius - (16 * p.scale));
    });

    // 4. Screen flash on switch
    if (switchFlash > 0.01) {
        const flashGrad = ctx.createRadialGradient(CX(), CY(), 0, CX(), CY(), Math.max(W(), H()) * 0.6);
        flashGrad.addColorStop(0, `rgba(200, 220, 255, ${switchFlash * 0.06})`);
        flashGrad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = flashGrad;
        ctx.fillRect(0, 0, W(), H());
    }

    // 5. Update & Draw Plasma Bolts
    for (let i = plasmaBolts.length - 1; i >= 0; i--) {
        if ((time - plasmaBolts[i].born) / 1000 > plasmaBolts[i].maxLife) {
            plasmaBolts.splice(i, 1);
        }
    }
    
    const activeCount = plasmaBolts.filter(b => b.sphere === activeSphere).length;
    if (activeCount < MAX_BOLTS && Math.random() < 0.35) {
        spawnPlasmaBolt(activeSphere);
    }
    
    plasmaBolts.forEach(b => drawPlasmaBolt(b, time));

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
